name: testing-workflow

on:
  push:
  pull_request:

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run testing workflow
        run: python3 testing/run_workflow.py
